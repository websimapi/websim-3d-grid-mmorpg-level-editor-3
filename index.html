<html>
<head>
  <meta charset="UTF-8">
  <title>3D Grid MMORPG Level Editor</title>
  <base href=".">
  <link rel="stylesheet" href="style.css">
  <!-- Three.js, OrbitControls, and GLTFLoader via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
  <div id="editor-container">
    <div id="toolbar">
      <h2>Level Editor</h2>
      
      <div class="section-header">
        <h3>Tools</h3>
        <button class="section-toggle">&#x25bc;</button>
      </div>
      <div class="section-content expanded">
        <button class="tool-button" id="place-block">Place Block</button>
        <button class="tool-button" id="color-dropper">Color Dropper</button>
        <button class="tool-button" id="select-tool">Select</button> 
        <button class="tool-button" id="remove-block">Remove Block</button>
        <button class="tool-button" id="export-json">Export JSON</button>
        <input type="file" id="import-input" accept=".json" style="display: none;">
        <button class="tool-button" id="import-json">Import JSON</button>
        <button class="tool-button" id="undo-action">Undo</button>
        <button class="tool-button" id="redo-action" disabled>Redo</button>
      </div>

      <div class="section-header">
        <h3>Grid Size: 32x32</h3>
        <button class="section-toggle">&#x25bc;</button>
      </div>
      <div class="section-content expanded">
        <div class="block-settings">
          <label>Block Type</label>
          <select id="block-type" class="asset-type-select">
            <option value="full">Full Block</option>  
            <option value="half" selected>Half Block</option>
            <option value="stair">Stair Block</option>
          </select>

          <label>Block Orientation</label>
          <select id="block-orientation" class="asset-type-select">
            <option value="north" selected>North</option>
            <option value="south">South</option>
            <option value="east">East</option>
            <option value="west">West</option>
          </select>

          <label>Block Color</label>
          <input type="color" id="block-color" value="#8888ff">
        </div>
      </div>

      <div class="section-header">
        <h3>Asset Library</h3>
        <button class="section-toggle">&#x25bc;</button>
      </div>
      <div class="section-content expanded">
        <input type="file" id="model-input" accept=".gltf,.glb" style="display: none;">
        <button class="tool-button" id="load-model">Upload 3D Model</button>
        <input type="file" id="texture-input" accept="image/*" style="display: none;">
        <button class="tool-button" id="load-texture">Upload Texture</button>
        <div id="asset-list">
          <!-- Assets will be added here dynamically -->
        </div>
      </div>

      <div class="section-header">
        <h3>Placed Assets</h3>
        <button class="section-toggle">&#x25bc;</button>
      </div>
      <div class="section-content expanded">
        <div id="placed-assets-list">
          <!-- Placed assets will be listed here -->
        </div>
      </div>

      <div class="section-header">
        <h3>Placed Blocks</h3>
        <button class="section-toggle">&#x25bc;</button>
      </div>
      <div class="section-content expanded">
        <div id="placed-blocks-list">
          <!-- Placed blocks will be listed here -->
        </div>
      </div>

      <div class="section-header">
        <h3>Action History</h3>
        <button class="section-toggle">&#x25bc;</button>
      </div>
      <div class="section-content expanded">
        <div id="action-history">
          <!-- Actions will be listed here -->
        </div>
      </div>
      
      <!-- Online users section -->
      <div class="section-header">
        <h3>Online Users</h3>
        <button class="section-toggle">&#x25bc;</button>
      </div>
      <div class="section-content expanded">
        <div id="online-users">
          <!-- Connected users will be listed here -->
        </div>
      </div>
    </div>
    <div id="grid-container">
    </div>
    <button id="toggle-menu">
      <svg class="menu-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </button>
  </div>

  <div id="debug-console">
    <h3 class="debug-header">Debug Console</h3>
    <div id="debug-content"></div>
  </div>

  <!-- Note: We load main.js as a module, which in turn loads all other modules -->
  <script type="module" src="main.js"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
